<div class="dex-page">
  @if (loading()) {
    <app-loading-spinner></app-loading-spinner>
  }

  @if (!loading() && items().length === 0) {
    <div class="favorites__empty">
      <img src="/pokeball.png" alt="" class="favorites__empty-img" loading="lazy" />
      <h2 class="favorites__empty-title">Nenhum favorito ainda</h2>
      <p class="favorites__empty-text">Toque no coração de um Pokémon pra salvar aqui!</p>
    </div>
  }

  <div class="favorites__grid" role="list">
    @for (item of items(); track item.id) {
      <app-pokemon-card
        [pokemon]="item"
        [isFavorite]="true"
        [types]="typesById().get(item.id) ?? []"
        (favoriteToggled)="onFavoriteToggled($event)"
      ></app-pokemon-card>
    }
  </div>
</div>
