<div class="pokemon-list">
  <div class="pokemon-list__filters">
    <div class="dex-search">
      <mat-icon>search</mat-icon>
      <input
        class="dex-search__input"
        type="text"
        placeholder="Buscar por nome, ID ou tipo"
        [value]="searchTerm()"
        (input)="onSearchChange($any($event.target).value)"
      />
    </div>
    <div class="pokemon-list__type-filters">
      @for (type of availableTypes(); track type.name) {
        <button
          class="type-chip"
          [class.type-chip--active]="selectedTypes().has(type.name)"
          [style.--type-color]="type.color"
          (click)="toggleTypeFilter(type.name)"
        >
          {{ type.label }}
        </button>
      }
    </div>
  </div>

  <div class="pokemon-list__grid">
    @for (item of filteredItems(); track item.id) {
      <app-pokemon-card
        [pokemon]="item"
        [isFavorite]="favoritesService.isFavorite(item.id)"
        [types]="typesById().get(item.id) ?? []"
        (favoriteToggled)="onFavoriteToggled($event)"
      ></app-pokemon-card>
    } @empty {
      <p>Nenhum pokémon encontrado.</p>
    }
  </div>

  @if (loading()) {
    <app-loading-spinner></app-loading-spinner>
  }

  <div #sentinel class="pokemon-list__sentinel"></div>
</div>
