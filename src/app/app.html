<div class="pokedex-frame">
  <div class="pokedex-frame__screen">
    @if (!isDetailRoute()) {
      <header class="pokedex-frame__header">
        <h1 class="pokedex-frame__title">Pokédex</h1>
        <p class="pokedex-frame__subtitle">Busque um pokémon pelo nome ou explore a lista completa</p>
      </header>
    }
    <div class="pokedex-frame__screen-scroll">
      <router-outlet></router-outlet>
    </div>

    @if (!isDetailRoute()) {
      <nav class="pokedex-frame__bottom-nav">
        <a
          routerLink="/"
          routerLinkActive="pokedex-frame__bottom-tab--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="pokedex-frame__bottom-tab"
        >
          <mat-icon>view_list</mat-icon>
          <span>Lista</span>
        </a>
        <a
          routerLink="/favoritos"
          routerLinkActive="pokedex-frame__bottom-tab--active"
          class="pokedex-frame__bottom-tab"
        >
          <mat-icon>favorite</mat-icon>
          <span>Favoritos</span>
        </a>
        <a
          routerLink="/comparar"
          routerLinkActive="pokedex-frame__bottom-tab--active"
          class="pokedex-frame__bottom-tab"
        >
          <mat-icon>compare_arrows</mat-icon>
          <span>Comparar</span>
        </a>
      </nav>
    }
  </div>
</div>
