<div class="pokedex-frame">
  <div class="pokedex-frame__screen">
    <div class="pokedex-frame__screen-scroll">
      @if (!isDetailRoute()) {
        <header class="pokedex-frame__header">
          <div class="pokedex-frame__header-row">
            <div>
              <h1 class="pokedex-frame__title">{{ title }}</h1>
              <p class="pokedex-frame__subtitle">{{ subtitle }}</p>
            </div>
            <button class="pokedex-frame__theme-btn" (click)="toggleDarkMode()" [attr.aria-label]="isDarkMode() ? 'Modo claro' : 'Modo escuro'">
              <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
            </button>
          </div>
        </header>
      }
      <router-outlet></router-outlet>
    </div>

    @if (!isDetailRoute()) {
      <nav class="pokedex-frame__bottom-nav">
        <a
          routerLink="/"
          routerLinkActive="pokedex-frame__bottom-tab--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="pokedex-frame__bottom-tab"
        >
          <mat-icon>grid_view</mat-icon>
          <span>Lista</span>
        </a>
        <a
          routerLink="/favoritos"
          routerLinkActive="pokedex-frame__bottom-tab--active"
          class="pokedex-frame__bottom-tab"
        >
          <span class="pokedex-frame__bottom-tab-icon">
            <mat-icon>favorite</mat-icon>
            @if (favoriteCount() > 0) {
              <span class="pokedex-frame__fav-badge">{{ favoriteCount() }}</span>
            }
          </span>
          <span>Favoritos</span>
        </a>
        <a
          routerLink="/comparar"
          routerLinkActive="pokedex-frame__bottom-tab--active"
          class="pokedex-frame__bottom-tab"
        >
          <mat-icon>compare_arrows</mat-icon>
          <span>Comparar</span>
        </a>
      </nav>
    }
  </div>
</div>
