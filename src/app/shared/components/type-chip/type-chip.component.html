<div class="type-filter" role="group" aria-label="Filtro por tipo">
  @for (type of types; track type.id) {
    <button
      type="button"
      class="type-filter__chip"
      [class.type-filter__chip--active]="isSelected(type.name)"
      [attr.aria-pressed]="isSelected(type.name)"
      (click)="toggle(type.name)"
    >
      {{ label(type.name) }}
    </button>
  }
</div>
